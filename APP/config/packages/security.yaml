security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # staff land in the calendar, technicians in their own area
                default_target_path: app_start
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/(login|logout|forgot-password|reset-password), roles: PUBLIC_ACCESS }
        # calendar subscriptions are reached by their secret token
        - { path: '^/kalender/[0-9a-f]{40}\.ics$', roles: PUBLIC_ACCESS }
        # signed links from the open-call mails work without logging in
        - { path: ^/technik/interesse/, roles: PUBLIC_ACCESS }
        # technicians only see their own area, documents and their profile (all read-only)
        - { path: ^/(start$|technik|profil$|dateien/\d+$), roles: ROLE_TECHNICIAN }
        - { path: ^/, roles: ROLE_USER }

    # ROLE_TECHNICIAN: read-only technician area (all appointments, own assignments)
    # ROLE_USER: calendar and all day-to-day data
    # ROLE_ADMIN: deleting, rooms, users, event categories, contact categories
    # ROLE_SUPERUSER: e-mail templates, granting admin rights
    role_hierarchy:
        ROLE_SUPERUSER: [ ROLE_ADMIN ]
        ROLE_ADMIN: [ ROLE_EDITOR ]
        ROLE_EDITOR: [ ROLE_USER ]
        ROLE_USER: [ ROLE_TECHNICIAN ]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
