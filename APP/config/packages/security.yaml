security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_calendar
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/(login|forgot-password|reset-password), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

    # ROLE_USER: calendar and all day-to-day data
    # ROLE_ADMIN: deleting, rooms, users, event categories, contact categories
    # ROLE_SUPERUSER: e-mail templates, granting admin rights
    role_hierarchy:
        ROLE_SUPERUSER: [ ROLE_ADMIN ]
        ROLE_ADMIN: [ ROLE_EDITOR ]
        ROLE_EDITOR: [ ROLE_USER ]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
