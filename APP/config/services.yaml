# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    avatars_dir: '%kernel.project_dir%/public/uploads/avatars'
    production_images_dir: '%kernel.project_dir%/public/uploads/productions'
    wordpress_api_url: '%env(WORDPRESS_API_URL)%'
    # Fields that WordPress owns. They are read-only here for records that come from
    # WordPress and are overwritten by every import. Since 2026-10 this system leads;
    # only what WordPress generates or computes itself is left.
    wordpress_owned_fields:
        production: [permalink]
        production_event: [incomingTotal, freeSeats, reservations]

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\WordPressPushService:
        arguments:
            $wordpressApiUrl: '%wordpress_api_url%'
            $wordpressApiUser: '%env(WORDPRESS_API_USER)%'
            $wordpressApiPassword: '%env(WORDPRESS_API_PASSWORD)%'

    App\Service\BruxApiSyncService:
        arguments:
            $apiUrl: '%env(BRUX_API_URL)%'

    App\Service\FieldOwnership:
        arguments:
            $ownedFields: '%wordpress_owned_fields%'

